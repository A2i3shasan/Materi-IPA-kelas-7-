<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materi IPA Kelas 7</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: 'Segoe UI', system-ui, sans-serif; 
    background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.7)), url('https://images.unsplash.com/photo-1509062522246-3755977927d7?q=80&w=1000&auto=format&fit=crop');
    background-size: cover; background-position: center; background-attachment: fixed;
    color: #fff; padding: 20px; min-height: 100vh; 
  }
  .container { max-width: 500px; margin: 0 auto; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: #94a3b8; font-size: 14px; font-weight: 600; margin-bottom: 24px; padding: 10px 16px; background: rgba(30, 41, 59, 0.7); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
  .header { margin-bottom: 28px; }
  .header h1 { font-size: 28px; font-weight: 800; color: #60a5fa; margin-bottom: 6px; }
  .header p { font-size: 14px; color: #cbd5e1; }
  .list-materi { display: flex; flex-direction: column; gap: 12px; }
  .card-materi { display: block; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); padding: 18px 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); text-decoration: none; color: #fff; transition: all 0.2s; cursor: pointer; }
  .card-materi:active { transform: scale(0.97); border-color: #818cf8; }
  .card-materi h3 { font-size: 16px; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; }
  .card-materi p { font-size: 12px; color: #94a3b8; }
  .baca-materi { display: none; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px); padding: 24px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); margin-top: 20px; animation: slideDown 0.4s ease; }
  .baca-materi.show { display: block; }
  .baca-materi h2 { font-size: 22px; color: #fcd34d; margin-bottom: 16px; border-bottom: 2px solid rgba(252, 211, 77, 0.3); padding-bottom: 10px; }
  .baca-materi h3 { font-size: 18px; color: #60a5fa; margin-top: 16px; margin-bottom: 8px; }
  .baca-materi p { font-size: 15px; line-height: 1.7; color: #e2e8f0; margin-bottom: 10px; }
  .baca-materi ul { padding-left: 20px; margin-bottom: 10px; }
  .baca-materi li { font-size: 15px; line-height: 1.7; color: #e2e8f0; margin-bottom: 4px; }
  .btn-tutup { display: inline-block; margin-top: 20px; padding: 12px 24px; background: rgba(255,255,255,0.1); color: #fff; border-radius: 12px; font-weight: 700; text-decoration: none; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; font-family: inherit; font-size: 14px; }
  .btn-tutup:active { background: rgba(255,255,255,0.2); }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
  <div class="container">
    <a href="menu.html" class="back-btn">← Kembali ke Menu</a>
    <div class="header"><h1>Materi IPA Kelas 7</h1><p>Pilih materi untuk mulai membaca</p></div>
    <div class="list-materi" id="list-materi"></div>
    <div class="baca-materi" id="baca-materi">
      <h2 id="judul-baca">Judul</h2>
      <div id="konten-baca"></div>
      <button class="btn-tutup" onclick="tutupMateri()">Tutup Materi</button>
    </div>
  </div>
  <script src="data-materi.js"></script>
  <script>
    const listContainer = document.getElementById('list-materi');
    const bacaContainer = document.getElementById('baca-materi');
    function tampilkanDaftar() {
      listContainer.innerHTML = '';
      const materiIPA = dataMateri.filter(m => m.mapel === "IPA" && m.kelas === "7");
      if (materiIPA.length === 0) { listContainer.innerHTML = `<p style="color:#94a3b8;">Belum ada materi IPA.</p>`; return; }
      materiIPA.forEach((materi) => {
        const card = document.createElement('div');
        card.className = 'card-materi';
        card.innerHTML = `<h3>${materi.judul}</h3><p>Klik untuk membaca materi</p>`;
        card.onclick = () => bukaMateri(materi.id);
        listContainer.appendChild(card);
      });
    }
    function bukaMateri(id) {
      const materi = dataMateri.find(m => m.id === id);
      if (materi) {
        document.getElementById('judul-baca').innerText = materi.judul;
        document.getElementById('konten-baca').innerHTML = materi.konten;
        listContainer.style.display = 'none';
        bacaContainer.classList.add('show');
        window.scrollTo(0, 0);
      }
    }
    function tutupMateri() {
      bacaContainer.classList.remove('show');
      listContainer.style.display = 'flex';
    }
    tampilkanDaftar();
  </script>
</body>
</html>
