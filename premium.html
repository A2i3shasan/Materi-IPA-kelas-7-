<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buka Materi Premium</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: 'Segoe UI', sans-serif; 
    background: linear-gradient(135deg, #1e1b4b, #4338ca); 
    color: #fff; 
    padding: 20px; 
    min-height: 100vh; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
  }
  .box { 
    background: rgba(30, 41, 59, 0.9); 
    padding: 30px 24px; 
    border-radius: 24px; 
    max-width: 400px; 
    width: 100%; 
    text-align: center; 
    border: 1px solid rgba(255,255,255,0.1); 
  }
  
  /* BAGIAN NOMOR WA (PALING ATAS) */
  .wa-banner {
    background: #fef08a;
    color: #854d0e;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 25px;
    border: 2px solid #eab308;
  }
  .wa-banner p { font-size: 14px; font-weight: 600; margin-bottom: 5px; }
  .wa-banner h2 { font-size: 26px; font-weight: 900; letter-spacing: 1px; margin-bottom: 10px; color: #b45309; }
  .wa-banner button {
    background: #25D366;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
  }

  .icon { font-size: 50px; margin-bottom: 16px; }
  h1 { font-size: 22px; color: #fcd34d; margin-bottom: 8px; }
  p { font-size: 13px; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }
  input { 
    width: 100%; 
    padding: 16px; 
    border-radius: 12px; 
    border: 2px solid #334155; 
    background: #1e293b; 
    color: #fff; 
    font-size: 16px; 
    text-align: center; 
    font-weight: bold; 
    outline: none; 
    margin-bottom: 16px; 
    text-transform: uppercase; 
  }
  input:focus { border-color: #fcd34d; }
  .btn { 
    width: 100%; 
    padding: 16px; 
    background: linear-gradient(135deg, #fbbf24, #f59e0b); 
    color: #78350f; 
    border: none; 
    border-radius: 12px; 
    font-weight: 800; 
    font-size: 16px; 
    cursor: pointer; 
  }
  .btn:active { transform: scale(0.97); }
  #pesan { margin-top: 15px; font-size: 14px; font-weight: bold; min-height: 20px; }
  
  .back { display: inline-block; margin-top: 20px; text-decoration: none; color: #64748b; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
  <div class="box">
    
    <!-- NOMOR WA DITARUH DI SINI BIAR PASTI KELIHATAN -->
    <div class="wa-banner">
      <p>Belum punya sandi? Beli ke Admin:</p>
      <h2>085167172915</h2>
      <button onclick="salinNomor()" id="btn-wa">📋 Salin Nomor</button>
    </div>

    <div class="icon">🔑</div>
    <h1>Buka Paket Premium</h1>
    <p>Masukkan kode akses yang kamu beli.</p>
    
    <input type="text" id="kode-akses" placeholder="Masukkan Sandi...">
    <button class="btn" onclick="cekKode()">Buka Kunci 🔓</button>
    
    <div id="pesan"></div>

    <a onclick="window.location.href='guru-dashboard.html'" class="back">← Kembali ke Dashboard</a>
  </div>

  <script>
    function salinNomor() {
      const nomor = "085167172915";
      const btn = document.getElementById('btn-wa');
      navigator.clipboard.writeText(nomor).then(() => {
        btn.innerHTML = "✅ Tersalin!";
        btn.style.background = "#15803d";
        alert("Nomor berhasil disalin! Buka WhatsApp dan chat ke nomor tersebut.");
        setTimeout(() => {
          btn.innerHTML = "📋 Salin Nomor";
          btn.style.background = "#25D366";
        }, 3000);
      });
    }

    const daftarKode = {
      "AZYB37": { durasi: 1 },
      "AHZY99": { durasi: 7 },
      "CZYH77": { durasi: 30 }
    };

    function cekKode() {
      const input = document.getElementById('kode-akses').value.toUpperCase().trim();
      const pesan = document.getElementById('pesan');

      if (daftarKode[input]) {
        const paket = daftarKode[input];
        const sekarang = new Date().getTime();
        const kedaluwarsa = sekarang + (paket.durasi * 24 * 60 * 60 * 1000);
        
        localStorage.setItem('premium_expired', kedaluwarsa);
        
        pesan.style.color = "#22c55e";
        pesan.innerText = `Berhasil! Premium aktif ${paket.durasi} hari.`;
        
        setTimeout(() => {
          window.location.href = "guru-dashboard.html";
        }, 1500);
      } else {
        pesan.style.color = "#ef4444";
        pesan.innerText = "Sandi salah!";
      }
    }
  </script>
</body>
 </html>
