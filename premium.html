<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buka Materi Premium</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1e1b4b, #4338ca); color: #fff; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
  .box { background: rgba(30, 41, 59, 0.9); padding: 32px 24px; border-radius: 24px; max-width: 400px; width: 100%; text-align: center; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
  .icon { font-size: 60px; margin-bottom: 16px; }
  h1 { font-size: 22px; color: #fcd34d; margin-bottom: 8px; }
  p { font-size: 13px; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }
  input { width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #334155; background: #1e293b; color: #fff; font-size: 16px; text-align: center; font-weight: bold; outline: none; margin-bottom: 16px; text-transform: uppercase; }
  input:focus { border-color: #fcd34d; }
  .btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #78350f; border: none; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; }
  .btn:active { transform: scale(0.97); }
  #pesan { margin-top: 15px; font-size: 14px; font-weight: bold; min-height: 20px; }
  
  /* Tombol Salin WA */
  .wa-copy-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: #25D366; color: white; padding: 14px; border-radius: 12px;
    font-weight: 700; font-size: 15px; margin-top: 10px; cursor: pointer;
    border: none; width: 100%; transition: 0.2s;
  }
  .wa-copy-btn:active { transform: scale(0.96); background: #1ebe5a; }
  
  .nomor-wa { font-size: 18px; font-weight: bold; color: #fcd34d; margin-top: 8px; letter-spacing: 1px; }
  
  .back { display: inline-block; margin-top: 20px; text-decoration: none; color: #64748b; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">🔑</div>
    <h1>Buka Paket Premium</h1>
    <p>Masukkan kode akses yang kamu beli. Materi akan terbuka otomatis sesuai durasi paket.</p>
    
    <input type="text" id="kode-akses" placeholder="Masukkan Sandi...">
    <button class="btn" onclick="cekKode()">Buka Kunci 🔓</button>
    
    <div id="pesan"></div>

    <!-- PEMISAH & TOMBOL SALIN WA -->
    <div style="margin-top: 25px; padding-top: 20px; border-top: 1px solid #334155;">
      <p style="font-size: 13px; color: #94a3b8; margin-bottom: 12px;">Belum punya kode akses? Hubungi Admin:</p>
      
      <div class="nomor-wa">085167172915</div>
      
      <button onclick="salinNomor()" class="wa-copy-btn" id="btn-wa">
        <span>📋</span> Salin Nomor WA Admin
      </button>
    </div>
    
    <!-- TOMBOL KEMBALI -->
    <a onclick="window.location.href='guru-dashboard.html'" class="back">← Kembali ke Dashboard</a>
  </div>

  <script>
    // === FUNGSI SALIN NOMOR ===
    function salinNomor() {
      const nomor = "085167172915";
      const btn = document.getElementById('btn-wa');
      
      // Copy ke clipboard
      navigator.clipboard.writeText(nomor).then(() => {
        // Ubah tampilan tombol sementara
        btn.innerHTML = "✅ Nomor Tersalin!";
        btn.style.background = "#15803d";
        
        alert("Nomor WA Admin berhasil disalin!\n\nSilakan buka aplikasi WhatsApp dan chat ke nomor tersebut untuk membeli akses.");
        
        // Balikin ke semula setelah 3 detik
        setTimeout(() => {
          btn.innerHTML = "<span>📋</span> Salin Nomor WA Admin";
          btn.style.background = "#25D366";
        }, 3000);
      }).catch(err => {
        alert("Gagal menyalin. Nomor Admin: " + nomor);
      });
    }

    // === DAFTAR KODE & DURASI ===
    const daftarKode = {
      "AZYB37": { durasi: 1 },    // 1 Hari
      "AHZY99": { durasi: 7 },    // 1 Minggu
      "CZYH77": { durasi: 30 }    // 1 Bulan
    };

    function cekKode() {
      const input = document.getElementById('kode-akses').value.toUpperCase().trim();
      const pesan = document.getElementById('pesan');

      if (daftarKode[input]) {
        const paket = daftarKode[input];
        const sekarang = new Date().getTime();
        const kedaluwarsa = sekarang + (paket.durasi * 24 * 60 * 60 * 1000);
        
        localStorage.setItem('premium_expired', kedaluwarsa);
        
        pesan.style.color = "#22c55e";
        pesan.innerText = `Berhasil! Premium aktif selama ${paket.durasi} hari.`;
        
        setTimeout(() => {
          window.location.href = "guru-dashboard.html";
        }, 1500);
      } else {
        pesan.style.color = "#ef4444";
        pesan.innerText = "Sandi salah atau tidak valid!";
      }
    }
  </script>
</body>
</html>
